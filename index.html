<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario - Hardcore Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }
        #game-wrapper {
            position: relative;
            width: 800px;
            height: 480px;
            box-shadow: 0 15px 50px rgba(0,0,0,1);
            border: 4px solid #fff;
            background-color: #5C94FC; /* Default Sky */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 15px; left: 0; width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
        .ui-col { text-align: center; }
        
        /* 2nd Jump Gauge Style */
        .gauge-container {
            width: 140px;
            height: 16px;
            border: 2px solid white;
            background: #222;
            margin-top: 4px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        #gauge-fill {
            width: 100%;
            height: 100%;
            background: #F8D870;
            transition: width 0.1s linear, background-color 0.2s;
        }
        #gauge-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 1px;
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 0 #000;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }
        #overlay h1 { font-size: 36px; margin-bottom: 20px; text-shadow: 4px 4px 0 #E52521; }
        #overlay p { font-size: 16px; animation: blinker 1s infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="ui-layer">
            <div class="ui-col">MARIO<br><span id="score">000000</span></div>
            <div class="ui-col"><br>🪙 x<span id="coins">00</span></div>
            <div class="ui-col">
                2ND JUMP GAUGE
                <div class="gauge-container">
                    <div id="gauge-fill"></div>
                    <div id="gauge-text">READY</div>
                </div>
            </div>
            <div class="ui-col">WORLD<br><span id="world">1-1</span></div>
            <div class="ui-col">TIME<br><span id="time">400</span></div>
        </div>

        <div id="overlay">
            <h1 id="overlay-title">SUPER MARIO</h1>
            <p id="overlay-sub">Press SPACE to Start</p>
        </div>

        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        const P = {
            '_': null, 'R': '#E52521', 'W': '#FFFFFF', 'S': '#FFCC99', 
            'B': '#000000', 'C': '#5C3A21', 'D': '#C84C0C', 'G': '#00A800', 
            'Y': '#F8D870', 'X': '#787878', 'H': '#0055FF'
        };

        const SPRITES = {
            mario: [
                "____WWWWW_______","___WWWWWWWWW____","___SSSCCSC______","__SCSCCCSSSC____",
                "__SCS_CCSSSC____","__SSCCCCSSSS____","____CCCCCCC_____","___RRRWRRR______",
                "__RRRRWRRRR_____","_RRRRRWRRRR_____","_RR__W_W__R_____","_R___WWW________",
                "_____WWW________","____WW_WW_______","___CCC_CCC______","__CCCC_CCCC_____"
            ].map(r => r.replace(/_/g, '_')),
            goomba: [
                "______BBBB______","_____BDDDDB_____","____BDDDDDDB____","___BDDDWWDDDB___",
                "__BDBDWWWWDBDB__","__BDBWWBBWWBDC__","__BDDWBBBBWDDB__","___BDDDDDDDDB___",
                "___BBBBBBBBBB___","____S______S____","___SSS____SSS___","__BSSSB__BSSSB__",
                "__BBBBB__BBBBB__","________________","________________","________________"
            ].map(r => r.replace(/C/g, 'B')),
            koopa: [ 
                "______BBBB______","_____BSSSSB_____","____BSBBSSSB____","___BSBSSSSSSB___",
                "___BSSSSSSSSB___","___BSSSSSSB_____","____BSSSSB______","___BBGGGGBB_____",
                "__BGGGGGGGGB____","__BWGGGGGGWBB___","_BWXGGGGGGXW_B__","_BWWGGGGGGWWSB__",
                "_BWWWWWWWWWWSB__","__BWWWWWWWWBB___","___BB____BB_____","___BB____BB_____"
            ],
            paratroopa: [ // Koopa with Wings
                "__WWW_BBBB_WWW__","__WW_BSSSSB_WW__","_WW_BSBBSSSB_WW_",
                "WW__BSBSSSSSSB__","W___BSSSSSSSSB__","____BSSSSSSB____",
                "_____BSSSSB_____","____BBGGGGBB____","___BGGGGGGGGB___",
                "___BWGGGGGGWBB__","__BWXGGGGGGXW_B_","__BWWGGGGGGWWSB_",
                "__BWWWWWWWWWWSB_","___BWWWWWWWWBB__","____BB____BB____","____BB____BB____"
            ],
            piranha: [
                "______BBBB______","_____BWWWWBB____","____BWRRRRWB____","___BWRWWRRRGB___",
                "___BRRRRRRRGB___","___BRRWWRRRGB___","___BRRRRRRRRB___","___BBRRRRRRBB___",
                "__BBBBBRRBBBBB__","__BWWBBBBBBWWB__","___BBBBBBBBBB___","_______GG_______",
                "______GGGG______","______GGGG______","______GGGG______","______GGGG______"
            ],
            brick: [
                "BBBBBBBBBBBBBBBB","DDDDDDDBDDDDDDDB","DDDDDDDBDDDDDDDB","DDDDDDDBDDDDDDDB",
                "BBBBBBBBBBBBBBBB","DDDBDDDDDDDBDDDD","DDDBDDDDDDDBDDDD","DDDBDDDDDDDBDDDD",
                "BBBBBBBBBBBBBBBB","DDDDDDDBDDDDDDDB","DDDDDDDBDDDDDDDB","DDDDDDDBDDDDDDDB",
                "BBBBBBBBBBBBBBBB","DDDBDDDDDDDBDDDD","DDDBDDDDDDDBDDDD","DDDBDDDDDDDBDDDD"
            ],
            solid: [ // Hard block for stairs
                "BBBBBBBBBBBBBBBB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB",
                "BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB",
                "BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB",
                "BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BCCCCCCCCCCCCCCB","BBBBBBBBBBBBBBBB"
            ],
            mystery: [
                "BBBBBBBBBBBBBBBB","BYYYYYYYYYYYYYYB","BYYYYYYYYYYYYYYB","BYYYYYBBBYYYYYYB",
                "BYYYYBYYYBYYYYYB","BYYYYBYYYBYYYYYB","BYYYYYYYYBYYYYYB","BYYYYYYYBYYYYYYB",
                "BYYYYYYBYYYYYYYB","BYYYYYYBYYYYYYYB","BYYYYYYYYYYYYYYB","BYYYYYYBYYYYYYYB",
                "BYYYYYYBYYYYYYYB","BBYYYYYYYYYYYYBB","BDDYYYYYYYYYYDDB","BBBBBBBBBBBBBBBB"
            ],
            empty: [
                "BBBBBBBBBBBBBBBB","BDDDDDDDDDDDDDDB","BDDDDDDDDDDDDDDB","BDDBBBBBBBBBBDDB",
                "BDBDDDDDDDDDDBDB","BDBDDDDDDDDDDBDB","BDBDDDDDDDDDDBDB","BDBDDDDDDDDDDBDB",
                "BDBDDDDDDDDDDBDB","BDBDDDDDDDDDDBDB","BDBDDDDDDDDDDBDB","BDBDDDDDDDDDDBDB",
                "BDDBBBBBBBBBBDDB","BDDDDDDDDDDDDDDB","BDDDDDDDDDDDDDDB","BBBBBBBBBBBBBBBB"
            ],
            coin: [
                "______BBBB______","____BBYYYYBB____","___BYYYYYYYYB___","__BYYBYYYYBYYB__",
                "__BYYBYYYYBYYB__","_BYYYBYYYYBYYYB_","_BYYYBYYYYBYYYB_","_BYYYBYYYYBYYYB_",
                "_BYYYBYYYYBYYYB_","_BYYYBYYYYBYYYB_","_BYYYBYYYYBYYYB_","__BYYBYYYYBYYB__",
                "__BYYBYYYYBYYB__","___BYYYYYYYYB___","____BBYYYYBB____","______BBBB______"
            ]
        };

        const TILE = 40;
        const GROUND_Y = 400; 
        const GRAVITY = 0.55; 
        const FRICTION = 0.85;

        let state = { mode: 'start', world: 1, stage: 1, score: 0, coins: 0, time: 400, frame: 0, cameraX: 0 };
        let blocks = [], enemies = [], fireballs = [], scenery = [], popups = [], particles = [];
        let flagpole = null;
        let currentPlatform = null; // Track platform player is standing on

        const player = {
            x: 100, y: 50, w: 32, h: 40,
            vx: 0, vy: 0, speed: 0.7, maxSpeed: 5.5,
            jump1: -11.5, jump2: -10.5,
            doubleJumpUsed: false, grounded: false, dir: 1, dead: false,
            jumpGauge: 100, isSpinning: false, spinAngle: 0
        };

        const keys = { left: false, right: false, space: false, spaceJustPressed: false };

        window.addEventListener("keydown", (e) => {
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.code) || e.key === " ") e.preventDefault();
            if (e.code === "ArrowLeft") keys.left = true;
            if (e.code === "ArrowRight") keys.right = true;
            if (e.code === "Space" || e.key === " ") {
                if (!keys.space) keys.spaceJustPressed = true;
                keys.space = true;
                if (state.mode === 'start' || state.mode === 'dead') {
                    if(state.mode === 'dead') { state.score = 0; state.coins = 0; }
                    initStage(); return;
                }
                if (state.mode === 'clear') {
                    state.stage++;
                    if (state.stage > 3) { state.world++; state.stage = 1; }
                    initStage(); return;
                }
            }
            if ((e.code === "KeyZ" || e.key === "z") && state.mode === 'playing') if (fireballs.length < 2) shootFireball();
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowLeft") keys.left = false;
            if (e.code === "ArrowRight") keys.right = false;
            if (e.code === "Space" || e.key === " ") keys.space = false;
        });

        function addBlock(x, y, w, h, type, extra = {}) {
            blocks.push({ x: x, y: y, w: w, h: h, type: type, bumpY: 0, ...extra });
        }
        function addGround(i) { addBlock(i * TILE, GROUND_Y, TILE, 480 - GROUND_Y, 'ground'); }
        
        function generateChunk(cx, type) {
            let startI = Math.floor(cx / TILE);
            let endI = startI;

            if (type === 'safe_start') {
                for (let i = 0; i < 15; i++) addGround(startI + i);
                endI = startI + 15;
            } 
            else if (type === 'stairs') {
                // 피라미드 계단 생성
                let width = 5;
                for (let i = 0; i < width; i++) {
                    addGround(startI + i);
                    for (let j = 0; j <= i; j++) addBlock((startI + i) * TILE, GROUND_Y - (j + 1) * TILE, TILE, TILE, 'solid');
                }
                // 구덩이
                startI += width + 2;
                // 내려가는 계단
                for (let i = 0; i < width; i++) {
                    addGround(startI + i);
                    for (let j = width - 1; j >= i; j--) addBlock((startI + i) * TILE, GROUND_Y - (j - i + 1) * TILE, TILE, TILE, 'solid');
                }
                endI = startI + width;
            }
            else if (type === 'moving_pit') {
                // 넓은 낭떠러지와 움직이는 리프트
                addGround(startI); addGround(startI+1);
                
                // 가로로 움직이는 플랫폼
                addBlock((startI + 3) * TILE, GROUND_Y - 40, TILE * 3, 20, 'moving', { 
                    vx: 2, vy: 0, minX: (startI + 2) * TILE, maxX: (startI + 8) * TILE 
                });
                
                // 수직으로 움직이는 플랫폼
                addBlock((startI + 10) * TILE, GROUND_Y - 40, TILE * 3, 20, 'moving', { 
                    vx: 0, vy: -1.5, minY: GROUND_Y - 160, maxY: GROUND_Y - 20 
                });

                startI += 13;
                addGround(startI); addGround(startI+1);
                endI = startI + 2;
            }
            else if (type === 'floating_islands') {
                // 바닥 없음, 공중 벽돌 섬들과 파라트루파
                addGround(startI);
                addBlock((startI + 2) * TILE, GROUND_Y - 80, TILE * 3, TILE, 'brick');
                
                enemies.push({ x: (startI + 4) * TILE, y: GROUND_Y - 140, base_y: GROUND_Y - 140, w: 32, h: 48, type: 'paratroopa', state: 'alive', timer: 0 });

                addBlock((startI + 6) * TILE, GROUND_Y - 160, TILE * 2, TILE, 'brick');
                addBlock((startI + 7) * TILE, GROUND_Y - 160, TILE, TILE, 'mystery', { state: 'active' });

                addBlock((startI + 10) * TILE, GROUND_Y - 60, TILE * 4, TILE, 'brick');
                
                startI += 14;
                addGround(startI); addGround(startI+1);
                endI = startI + 2;
            }
            else if (type === 'pipe_valley') {
                // 높이가 다양한 파이프와 뻐끔플라워
                for (let i = 0; i < 12; i++) addGround(startI + i);
                
                let heights = [60, 120, 80];
                for(let k=0; k<3; k++) {
                    let px = startI + 2 + (k*3);
                    let ph = heights[k];
                    addBlock(px * TILE, GROUND_Y - ph, TILE * 2, ph, 'pipe');
                    enemies.push({ x: px * TILE + 20, y: GROUND_Y - ph, startY: GROUND_Y - ph, w: 32, h: 48, type: 'piranha', timer: Math.random() * 100, state: 'hiding' });
                }
                
                endI = startI + 12;
            }
            else if (type === 'classic_run') {
                // 평지와 물음표 블록, 굼바
                for (let i = 0; i < 10; i++) addGround(startI + i);
                
                addBlock((startI + 3) * TILE, GROUND_Y - 140, TILE, TILE, 'mystery', { state: 'active' });
                addBlock((startI + 4) * TILE, GROUND_Y - 140, TILE, TILE, 'brick');
                addBlock((startI + 5) * TILE, GROUND_Y - 140, TILE, TILE, 'mystery', { state: 'active' });

                enemies.push({ x: (startI + 6) * TILE, y: GROUND_Y - 32, w: 32, h: 32, vx: -1.2, vy: 0, type: 'goomba', state: 'alive' });
                enemies.push({ x: (startI + 8) * TILE, y: GROUND_Y - 32, w: 32, h: 32, vx: -1.2, vy: 0, type: 'koopa', state: 'alive' });
                
                endI = startI + 10;
            }

            // 구름 장식
            for (let c = startI; c < endI; c += 5 + Math.random()*3) {
                scenery.push({ x: c*TILE, y: 40 + Math.random()*120, type: 'cloud' });
            }

            return endI * TILE;
        }

        function initStage() {
            document.getElementById('overlay').style.display = 'none';
            player.x = 100; player.y = 50; 
            player.vx = 0; player.vy = 0; player.dir = 1; player.dead = false;
            player.jumpGauge = 100; player.doubleJumpUsed = false; player.isSpinning = false;
            currentPlatform = null;
            
            state.cameraX = 0; state.time = 400; state.frame = 0;
            state.mode = 'playing';
            document.getElementById('world').innerText = `${state.world}-${state.stage}`;
            
            let bgColors = ['#5C94FC', '#000000', '#2038EC']; // Sky, Cave, Night
            document.getElementById('game-wrapper').style.backgroundColor = bgColors[(state.stage-1) % 3];

            blocks = []; enemies = []; scenery = []; fireballs = []; popups = []; particles = []; flagpole = null;
            
            let cx = 0;
            // 1. Safe Zone
            cx = generateChunk(cx, 'safe_start');
            
            // 2. Hardcore Chunks (Target length ~5000px)
            let chunkTypes = ['stairs', 'moving_pit', 'floating_islands', 'pipe_valley', 'classic_run'];
            while (cx < 4800) {
                // Ensure small gap between chunks
                addGround(Math.floor(cx/TILE)); addGround(Math.floor(cx/TILE)+1);
                cx += TILE * 2;
                
                let randomType = chunkTypes[Math.floor(Math.random() * chunkTypes.length)];
                cx = generateChunk(cx, randomType);
            }

            // 3. End Zone
            for(let i=0; i<10; i++) addGround(Math.floor(cx/TILE) + i);
            flagpole = { x: cx + TILE*4 + 16, y: 100, w: 4, h: 300, flagY: 120 };
        }

        function spawnParticles(px, py, type, count) {
            for(let i=0; i<count; i++) {
                let vx = (Math.random() - 0.5) * 6;
                let vy = (Math.random() - 1) * 6;
                let color = '#FFF';
                let maxLife = 20 + Math.random()*15;
                if(type === 'star') { color = '#F8D870'; vy -= 2; }
                if(type === 'dust') { color = '#CCC'; maxLife = 15; vy = -1; vx *= 0.5; }
                if(type === 'squash') { color = '#E52521'; }
                particles.push({x: px, y: py, vx: vx, vy: vy, life: maxLife, maxLife: maxLife, color: color, type: type});
            }
        }
        function shootFireball() {
            fireballs.push({ x: player.x + (player.dir === 1 ? player.w : -12), y: player.y + 10, w: 12, h: 12, vx: 8 * player.dir, vy: 0 });
            spawnParticles(player.x + 16, player.y + 16, 'star', 3);
        }
        function checkCol(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; }
        
        function killPlayer() {
            if (player.dead) return;
            player.dead = true; state.mode = 'dead'; player.vy = -12; 
            document.getElementById('overlay-title').innerText = "GAME OVER";
            document.getElementById('overlay-sub').innerText = "Press SPACE to Restart";
            setTimeout(() => { document.getElementById('overlay').style.display = 'flex'; }, 1000);
        }

        function update() {
            if (state.mode !== 'playing') return;
            state.frame++;
            if (state.frame % 60 === 0 && state.time > 0) state.time--;
            if (state.time <= 0) killPlayer();

            // Moving Platforms Update
            for(let b of blocks) {
                if(b.type === 'moving') {
                    b.x += b.vx; b.y += b.vy;
                    if(b.vx !== 0 && (b.x > b.maxX || b.x < b.minX)) b.vx *= -1;
                    if(b.vy !== 0 && (b.y > b.maxY || b.y < b.minY)) b.vy *= -1;
                }
            }

            // Player Physics
            currentPlatform = null;
            if (player.grounded) {
                player.jumpGauge += 1.5; 
                if (player.jumpGauge > 100) player.jumpGauge = 100;
                player.doubleJumpUsed = false; player.isSpinning = false;
            }

            if (keys.spaceJustPressed) {
                if (player.grounded) {
                    player.vy = player.jump1; player.grounded = false;
                    spawnParticles(player.x + 16, player.y + player.h, 'dust', 6);
                } else if (!player.doubleJumpUsed && player.jumpGauge >= 100) {
                    player.vy = player.jump2; player.doubleJumpUsed = true;
                    player.jumpGauge = 0; player.isSpinning = true;
                    spawnParticles(player.x + 16, player.y + 20, 'star', 12);
                }
            }
            keys.spaceJustPressed = false;

            if (keys.left) { player.vx -= player.speed; player.dir = -1; }
            if (keys.right) { player.vx += player.speed; player.dir = 1; }
            player.vx *= FRICTION;
            if (Math.abs(player.vx) < 0.2) player.vx = 0;
            if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
            if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

            player.x += player.vx;
            if (player.x < state.cameraX) player.x = state.cameraX; 
            if (player.x > state.cameraX + 400) state.cameraX = player.x - 400;

            // X Collision
            for (let b of blocks) {
                if (checkCol(player, b)) {
                    if (player.vx > 0) { player.x = b.x - player.w; player.vx = 0; }
                    else if (player.vx < 0) { player.x = b.x + b.w; player.vx = 0; }
                }
            }

            // Y Collision
            player.vy += GRAVITY;
            player.y += player.vy;
            player.grounded = false;

            for (let b of blocks) {
                if (b.bumpY < 0) b.bumpY += 1.5;
                if (b.bumpY > 0) b.bumpY = 0;

                if (checkCol(player, b)) {
                    if (player.vy > 0 && player.y < b.y + 20) {
                        player.y = b.y - player.h;
                        player.vy = 0; player.grounded = true; 
                        if(b.type === 'moving') currentPlatform = b; // Stick to moving platform
                    } else if (player.vy < 0 && b.type !== 'moving') { // Cant bump moving platforms from below easily
                        player.y = b.y + b.h; player.vy = 0;
                        if (b.type === 'mystery' && b.state === 'active') {
                            b.state = 'empty'; b.bumpY = -12; state.score += 100; state.coins += 1;
                            popups.push({ x: b.x + 4, y: b.y, vy: -8, timer: 30, type: 'coin' });
                            spawnParticles(b.x + TILE/2, b.y, 'star', 5);
                        }
                        else if (b.type === 'brick' && b.bumpY === 0) { b.bumpY = -5; spawnParticles(b.x + 20, b.y, 'dust', 3); }
                    }
                }
            }

            // Apply Moving Platform Velocity to Player
            if (currentPlatform) {
                player.x += currentPlatform.vx;
                player.y += currentPlatform.vy; // Keep attached if it moves down
                // Re-check X bounds after platform move
                if (player.x < state.cameraX) player.x = state.cameraX;
            }

            if (player.y > canvas.height) killPlayer();

            // Flagpole Check
            if (flagpole && player.x + player.w > flagpole.x && player.x < flagpole.x + flagpole.w) {
                state.mode = 'clear'; player.x = flagpole.x - player.w + 4; player.vx = 0; player.vy = 0;
                let slide = setInterval(() => {
                    if (player.y < GROUND_Y - player.h) {
                        player.y += 4; if (flagpole.flagY < GROUND_Y - 40) flagpole.flagY += 4;
                    } else {
                        clearInterval(slide); player.dir = 1; player.isSpinning = false;
                        document.getElementById('overlay-title').innerText = "COURSE CLEAR!";
                        document.getElementById('overlay-sub').innerText = "Press SPACE for Next Stage";
                        document.getElementById('overlay').style.display = 'flex';
                    }
                }, 20);
                return;
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                let f = fireballs[i];
                f.x += f.vx; f.vy += GRAVITY; f.y += f.vy;
                let destroyed = false;
                for (let b of blocks) {
                    if (checkCol(f, b) && b.type !== 'moving') {
                        if (f.vy > 0 && f.y < b.y + 15) { f.y = b.y - f.h; f.vy = -7; } // Bounce
                        else destroyed = true;
                    }
                }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (e.state === 'alive' && checkCol(f, e)) {
                        e.state = 'dead'; e.vy = -6; state.score += 200; destroyed = true;
                        spawnParticles(e.x+16, e.y+16, 'squash', 10);
                        popups.push({ x: e.x, y: e.y, vy: -2, timer: 20, type: 'score200' });
                    }
                }
                if (f.x > state.cameraX + 850 || f.x < state.cameraX - 50 || destroyed) {
                    spawnParticles(f.x, f.y, 'star', 2); fireballs.splice(i, 1);
                }
            }

            for (let i = popups.length - 1; i >= 0; i--) {
                let p = popups[i]; p.y += p.vy; p.timer--;
                if (p.timer <= 0) popups.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy;
                if(p.type === 'squash' || p.type === 'star') p.vy += 0.3;
                p.life--; if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (e.x > state.cameraX + 900) continue; 
                if (e.state === 'dead') {
                    e.y += e.vy; e.vy += GRAVITY;
                    if (e.y > canvas.height) enemies.splice(i, 1);
                    continue;
                }

                if (e.type === 'piranha') {
                    e.timer++; let phase = e.timer % 300;
                    if (phase < 100) { e.y -= 1; if (e.y < e.startY - e.h) { e.y = e.startY - e.h; e.state = 'exposed'; } } 
                    else if (phase > 150 && phase < 250) { e.y += 1; if (e.y >= e.startY) { e.y = e.startY; e.state = 'hiding'; } }
                } else if (e.type === 'paratroopa') {
                    e.timer += 0.05;
                    e.y = e.base_y + Math.sin(e.timer) * 40; // 사인파 비행
                } else {
                    e.vy += GRAVITY; e.x += e.vx; 
                    for (let b of blocks) {
                        if (checkCol(e, b) && b.type !== 'moving') {
                            if (e.vy > 0 && e.y < b.y + 15) { e.y = b.y - e.h; e.vy = 0; }
                            else if (e.y > b.y - e.h + 5) { e.vx *= -1; e.x += e.vx * 2; }
                        }
                    }
                }

                // 플레이어와 몬스터의 충돌 박스(Hitbox) 크기를 줄여서 스치기만 해도 죽는 현상 방지
                let pBox = { x: player.x + 8, y: player.y + 8, w: player.w - 16, h: player.h - 8 }; // 좌우/상단 마진 적용 (하단은 밟기를 위해 유지)
                let eBox = { x: e.x + 6, y: e.y + 6, w: e.w - 12, h: e.h - 12 };

                if (checkCol(pBox, eBox)) {
                    if (e.type === 'piranha' && e.state === 'hiding') continue;
                    
                    // 밟기 판정은 원래 좌표를 기준으로 넉넉하게 유지
                    if (player.vy > 0 && player.y + player.h < e.y + 24 && e.type !== 'piranha') {
                        player.vy = -8; state.score += 200; e.state = 'dead'; e.vy = 0;
                        player.jumpGauge = 100; // Refill gauge on squash!
                        spawnParticles(e.x+16, e.y+16, 'dust', 8);
                        popups.push({ x: e.x, y: e.y, vy: -2, timer: 20, type: 'score200' });
                    } else {
                        killPlayer();
                    }
                }
            }
            
            document.getElementById('score').innerText = String(state.score).padStart(6, '0');
            document.getElementById('coins').innerText = String(state.coins).padStart(2, '0');
            document.getElementById('time').innerText = String(Math.max(0, state.time)).padStart(3, '0');
            
            let fill = document.getElementById('gauge-fill'); let text = document.getElementById('gauge-text');
            fill.style.width = player.jumpGauge + '%';
            if (player.jumpGauge === 100) { fill.style.backgroundColor = '#F8D870'; text.innerText = "READY"; } 
            else { fill.style.backgroundColor = '#E52521'; text.innerText = "CHARGE"; }
        }

        function drawSprite(grid, x, y, size, flipX = false, overrideP = null) {
            let pSize = size / 16;
            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));
            if (flipX) { ctx.scale(-1, 1); ctx.translate(-size, 0); }
            for (let r = 0; r < 16; r++) {
                for (let c = 0; c < 16; c++) {
                    let char = grid[r][c];
                    if (char !== '_') {
                        let color = overrideP && overrideP[char] ? overrideP[char] : P[char];
                        ctx.fillStyle = color;
                        ctx.fillRect(Math.floor(c * pSize), Math.floor(r * pSize), Math.ceil(pSize), Math.ceil(pSize));
                    }
                }
            }
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-Math.floor(state.cameraX), 0);

            for (let s of scenery) {
                if (s.x + 80 < state.cameraX || s.x > state.cameraX + 850) continue;
                if (s.type === 'cloud') {
                    ctx.fillStyle = '#FFF'; ctx.fillRect(s.x+10, s.y, 60, 30); ctx.fillRect(s.x, s.y+10, 80, 20);
                }
            }

            if (flagpole) {
                ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(flagpole.x+2, flagpole.y, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#F8D870'; ctx.fillRect(flagpole.x, flagpole.y, flagpole.w, flagpole.h);
                ctx.fillStyle = '#00A800'; ctx.beginPath(); ctx.moveTo(flagpole.x, flagpole.flagY); 
                ctx.lineTo(flagpole.x-30, flagpole.flagY+15); ctx.lineTo(flagpole.x, flagpole.flagY+30); ctx.fill();
            }

            for (let e of enemies) if (e.type === 'piranha') drawSprite(SPRITES.piranha, e.x - 4, e.y, 40);

            for (let b of blocks) {
                if (b.x + b.w < state.cameraX || b.x > state.cameraX + 850) continue;
                let renderY = b.y + (b.bumpY || 0);
                
                if (b.type === 'ground' || b.type === 'brick' || b.type === 'solid') {
                    let pal = null;
                    if (state.stage === 2) pal = {'D': '#0055FF', 'B': '#000000', 'C': '#0055FF'}; 
                    let sprite = (b.type === 'solid' || b.type === 'ground') ? SPRITES.solid : SPRITES.brick;
                    // 타일링 렌더링 (넓이가 TILE보다 클 경우 반복)
                    for (let wx = 0; wx < b.w; wx += TILE) {
                        for (let wy = 0; wy < b.h; wy += TILE) {
                            drawSprite(sprite, b.x + wx, renderY + wy, TILE, false, pal);
                        }
                    }
                } else if (b.type === 'moving') {
                    // 리프트 렌더링
                    ctx.fillStyle = '#F8D870'; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = '#C84C0C'; ctx.fillRect(b.x, b.y+4, b.w, 4); ctx.fillRect(b.x, b.y+12, b.w, 4);
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
                } else if (b.type === 'mystery') {
                    if (b.state === 'empty') drawSprite(SPRITES.empty, b.x, renderY, TILE);
                    else {
                        let p = (Math.floor(state.frame / 10) % 2 === 0) ? null : {'Y': '#C84C0C'}; 
                        drawSprite(SPRITES.mystery, b.x, renderY, TILE, false, p);
                    }
                } else if (b.type === 'pipe') {
                    ctx.fillStyle = '#00A800'; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = '#FFF'; ctx.globalAlpha = 0.4; ctx.fillRect(b.x+4, b.y, 8, b.h); ctx.globalAlpha = 1.0;
                    ctx.fillStyle = '#00A800'; ctx.fillRect(b.x-2, b.y, b.w+4, 16); ctx.strokeRect(b.x-2, b.y, b.w+4, 16);
                }
            }

            for (let e of enemies) {
                if (e.type === 'goomba' || e.type === 'koopa' || e.type === 'paratroopa') {
                    let pal = (state.stage === 2 && e.type === 'goomba') ? {'D': '#0055FF'} : null;
                    if (e.state === 'dead') {
                        ctx.save(); ctx.translate(e.x, e.y + 16); ctx.scale(1, 0.5);
                        drawSprite(SPRITES[e.type === 'paratroopa' ? 'koopa' : e.type], 0, 0, 32, false, pal);
                        ctx.restore();
                    } else {
                        drawSprite(SPRITES[e.type], e.x, e.y, 32, Math.floor(state.frame / 15) % 2 === 0, pal);
                    }
                }
            }

            for (let p of popups) {
                if (p.type === 'coin') drawSprite(SPRITES.coin, p.x, p.y, 32);
                else { ctx.fillStyle = '#FFF'; ctx.font = "12px 'Press Start 2P'"; ctx.fillText("200", p.x, p.y); }
            }

            for (let f of fireballs) {
                ctx.fillStyle = (Math.floor(state.frame/3) % 2 === 0) ? '#E52521' : '#F8D870';
                ctx.fillRect(f.x, f.y, f.w, f.h);
            }
            
            ctx.save();
            ctx.translate(player.x + player.w/2, player.y + player.h/2);
            if (player.isSpinning) { player.spinAngle += 0.4; ctx.rotate(player.spinAngle); }
            let flipX = player.dir === -1 && !player.isSpinning;
            drawSprite(SPRITES.mario, -20, -20, 40, flipX);
            ctx.restore();

            for (let p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color; 
                let s = Math.max(2, (p.life/p.maxLife) * 6);
                ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
            }
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        function gameLoop() {
            if (state.mode === 'playing') update();
            else if (state.mode === 'dead') { player.y += player.vy; player.vy += GRAVITY; } 
            render();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
